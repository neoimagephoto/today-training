<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>今日之鍛鍊 - 日系家居健身清單</title>
    
    <!-- iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="日系健身">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Noto Sans TC & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        muji: {
                            bg: '#FBF9F5',         // 暖白 / 米白背景
                            card: '#FFFFFF',       // 卡片純白
                            text: '#2D2B2A',       // 柔和炭灰主字體
                            muted: '#8C857B',      // 次要木質灰文字
                            border: '#EFECE6',     // 淺米灰邊框
                            accent: '#D8CFC4',     // 淡米棕點綴
                            matcha: '#6E8A73',     // 抹茶綠（完成/強調色）
                            matchaLight: '#EBF1EC',// 抹茶淡綠背景
                            sand: '#F4F0EA',       // 沙色區塊
                            wood: '#A39382'        // 木質主調
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'PingFang TC', 'Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FBF9F5;
            color: #2D2B2A;
            font-family: 'Inter', -apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* Custom Scrollbar Styling - Subtle Japanese aesthetic */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #E8E2D5;
            border-radius: 4px;
        }

        /* Card check strike-through animation */
        .completed-title {
            text-decoration: line-through;
            color: #A09A91;
            transition: all 0.25s ease;
        }

        .checkbox-bounce {
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .checkbox-bounce:active {
            transform: scale(0.85);
        }

        /* Bottom safe area spacing for iPhone home indicator */
        .safe-pb {
            padding-bottom: calc(5rem + env(safe-area-inset-bottom, 16px));
        }

        .safe-pt {
            padding-top: calc(1rem + env(safe-area-inset-top, 0px));
        }

        /* Glassmorphism soft bar */
        .glass-header {
            background: rgba(251, 249, 245, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Custom Toast Notification */
        #toast {
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>
<body class="min-h-screen text-muji-text antialiased selection:bg-muji-matchaLight">

            <span>已更新操作</span>

    <!-- Main Container restricted to Mobile Viewport Width -->

            </div>
        </header>

        <!-- Progress Summary Section -->

            <div class="bg-white border border-muji-border rounded-2xl p-4 shadow-sm">

                    <span>動作檢索</span>

        <!-- Filter Controls (Visible mainly on Library or when browsing) -->

        <!-- Main Content Area -->
        <main class="flex-1 px-5 safe-pb">

            <div id="view-today" class="space-y-3">
                <div id="today-empty-state" class="hidden text-center py-12 px-4">
                    <div class="w-16 h-16 mx-auto mb-3 rounded-full bg-muji-sand flex items-center justify-center text-muji-muted">

                    </div>
                    <h3 class="text-sm font-medium text-muji-text">今日清單尚未加入動作</h3>
                    <p class="text-xs text-muji-muted mt-1 leading-relaxed">請前往「動作檢索」選擇適合的訓練，<br>輕鬆建構屬於你的家居健身計劃。</p>
                    <button onclick="switchTab('library')" class="mt-4 px-4 py-2 bg-muji-text text-white text-xs rounded-xl shadow-xs active:scale-95 transition-all">
                        瀏覽訓練動作
                    </button>
                </div>

                <div id="today-list-container" class="space-y-3">

                </div>

            <!-- VIEW 2: EXERCISE LIBRARY -->

                </div>

        <!-- Floating Rest Timer Footer Bar -->

            <div class="bg-white border border-muji-border/80 rounded-2xl p-3 shadow-md">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2.5">
                        <div id="timer-icon-bg" class="w-9 h-9 rounded-xl bg-muji-sand flex items-center justify-center text-muji-text">
                            <i class="fa-solid fa-stopwatch text-sm"></i>
                        </div>
                        <div>
                            <p class="text-[10px] text-muji-muted font-medium tracking-wide">組間休息計時</p>
                            <p id="timer-display" class="text-lg font-mono font-bold text-muji-text leading-none">00:00</p>

                    <div id="timer-presets" class="flex items-center gap-1.5">
                        <button onclick="startTimer(30)" class="px-2.5 py-1.5 bg-muji-sand hover:bg-muji-accent/40 rounded-lg text-xs font-medium text-muji-text transition-all active:scale-95">30秒</button>
                        <button onclick="startTimer(60)" class="px-2.5 py-1.5 bg-muji-sand hover:bg-muji-accent/40 rounded-lg text-xs font-medium text-muji-text transition-all active:scale-95">60秒</button>
                        <button onclick="startTimer(90)" class="px-2.5 py-1.5 bg-muji-sand hover:bg-muji-accent/40 rounded-lg text-xs font-medium text-muji-text transition-all active:scale-95">90秒</button>
                    </div>

                    <!-- Active Controls (Hidden default) -->
                    <div id="timer-controls" class="hidden flex items-center gap-2">
                        <button onclick="addTimerTime(10)" class="w-8 h-8 bg-muji-sand rounded-lg text-xs font-medium text-muji-text hover:bg-muji-accent/40 flex items-center justify-center">+10</button>
                        <button id="timer-toggle-btn" onclick="toggleTimer()" class="w-8 h-8 bg-muji-text text-white rounded-lg text-xs flex items-center justify-center">
                            <i class="fa-solid fa-pause"></i>
                        </button>
                        <button onclick="resetTimer()" class="w-8 h-8 bg-red-50 text-red-600 rounded-lg text-xs flex items-center justify-center">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>

            { id: 'l2', name: '高杯啞鈴深蹲 Goblet Squat', muscle: '腿部', equipment: '啞鈴', sets: '3 組 × 12 次', note: '雙手於胸前緊抱啞鈴進行深蹲' },
            { id: 'l3', name: '啞鈴向前弓步蹲 Dumbbell Lunge', muscle: '腿部', equipment: '啞鈴', sets: '3 組 × 12 次', note: '雙腿交替下蹲至90度' },
            { id: 'l4', name: '臀橋鍛鍊 Glute Bridge', muscle: '腿部', equipment: '徒手', sets: '3 組 × 15 次', note: '夾緊臀部向上頂起，強化臀大肌' },

        ];

        /* Application State */
        let state = {
            todayList: [], // Array of exercise IDs
            completedItems: {}, // Object map: { exerciseId: boolean }
            currentTab: 'today', // 'today' | 'library'
            filterMuscle: 'all',
            filterEquipment: 'all'
        };

        /* Timer State */
        let timer = {
            interval: null,
            remainingSeconds: 0,
            totalSeconds: 0,
            isRunning: false
        };

        window.onload = function() {
            initDate();
            loadStateFromStorage();
            renderApp();
        };

        // Render Current Date with Japanese/Traditional Chinese Format
        function initDate() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            const dateStr = now.toLocaleDateString('zh-TW', options);
            document.getElementById('current-date').textContent = dateStr;
        }

        // LocalStorage Logic
        function loadStateFromStorage() {
            try {
                const savedToday = localStorage.getItem('muji_workout_today');
                const savedCompleted = localStorage.getItem('muji_workout_completed');
                
                if (savedToday) state.todayList = JSON.parse(savedToday);
                if (savedCompleted) state.completedItems = JSON.parse(savedCompleted);
            } catch (e) {
                console.error("Failed to load local storage", e);
            }
        }

        function saveStateToStorage() {
            try {
                localStorage.setItem('muji_workout_today', JSON.stringify(state.todayList));
                localStorage.setItem('muji_workout_completed', JSON.stringify(state.completedItems));
            } catch (e) {
                console.error("Failed to save local storage", e);
            }
        }

        function renderApp() {
            updateProgress();
            renderTodayList();
            renderLibraryList();
            updateBadge();
        }

        // Tab Switching
        function switchTab(tab) {
            state.currentTab = tab;
            const btnToday = document.getElementById('tab-today');
            const btnLibrary = document.getElementById('tab-library');
            const viewToday = document.getElementById('view-today');
            const viewLibrary = document.getElementById('view-library');
            const filterSection = document.getElementById('filter-section');

            if (tab === 'today') {
                btnToday.className = "py-2.5 rounded-lg transition-all duration-200 bg-white shadow-xs text-muji-text font-semibold flex items-center justify-center gap-2";
                btnLibrary.className = "py-2.5 rounded-lg transition-all duration-200 text-muji-muted hover:text-muji-text flex items-center justify-center gap-2";
                viewToday.classList.remove('hidden');
                viewLibrary.classList.add('hidden');
                filterSection.classList.add('hidden');
            } else {
                btnLibrary.className = "py-2.5 rounded-lg transition-all duration-200 bg-white shadow-xs text-muji-text font-semibold flex items-center justify-center gap-2";
                btnToday.className = "py-2.5 rounded-lg transition-all duration-200 text-muji-muted hover:text-muji-text flex items-center justify-center gap-2";
                viewLibrary.classList.remove('hidden');
                viewToday.classList.add('hidden');
                filterSection.classList.remove('hidden');
            }
        }

        // Progress Calculation & Update
        function updateProgress() {
            const total = state.todayList.length;
            let completedCount = 0;

            state.todayList.forEach(id => {
                if (state.completedItems[id]) completedCount++;
            });

            const percent = total === 0 ? 0 : Math.round((completedCount / total) * 100);
            
            document.getElementById('progress-text').textContent = `${completedCount} / ${total} (${percent}%)`;
            document.getElementById('progress-bar').style.width = `${percent}%`;

            if (percent === 100 && total > 0) {
                document.getElementById('progress-bar').className = "bg-muji-matcha h-full rounded-full transition-all duration-500 ease-out animate-pulse";
            } else {
                document.getElementById('progress-bar').className = "bg-muji-matcha h-full rounded-full transition-all duration-500 ease-out";
            }
        }

        function updateBadge() {
            document.getElementById('badge-count').textContent = state.todayList.length;
        }

        function renderTodayList() {
            const container = document.getElementById('today-list-container');
            const emptyState = document.getElementById('today-empty-state');

            if (state.todayList.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            let html = '';

            state.todayList.forEach(id => {
                const item = EXERCISE_DATABASE.find(ex => ex.id === id);
                if (!item) return;

                const isDone = !!state.completedItems[id];

                html += `
                <div class="bg-white border ${isDone ? 'border-muji-border/50 bg-muji-bg/60' : 'border-muji-border'} rounded-2xl p-4 transition-all duration-300 shadow-xs flex items-center justify-between">
                    <div class="flex items-center gap-3.5 flex-1 min-w-0 pr-2">
                        <!-- Custom Minimalist Checkbox -->
                        <button onclick="toggleComplete('${item.id}')" class="checkbox-bounce w-6 h-6 rounded-lg border ${isDone ? 'bg-muji-matcha border-muji-matcha text-white' : 'border-muji-accent/80 bg-white'} flex items-center justify-center shrink-0">
                            ${isDone ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                        </button>

                        <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-2 mb-0.5">
                                <span class="text-[10px] px-2 py-0.5 rounded-md ${item.equipment === '徒手' ? 'bg-amber-50 text-amber-700 border border-amber-200/50' : 'bg-stone-100 text-stone-700 border border-stone-200/60'}">${item.equipment}</span>
                                <span class="text-[10px] px-2 py-0.5 rounded-md bg-muji-sand text-muji-muted">${item.muscle}</span>
                            </div>
                            <h4 class="text-sm font-medium ${isDone ? 'completed-title' : 'text-muji-text'} truncate">${item.name}</h4>
                            <p class="text-xs text-muji-muted mt-0.5 font-mono">${item.sets}</p>
                        </div>
                    </div>

                    <div class="flex items-center gap-1">
                        <button onclick="removeFromToday('${item.id}')" class="w-8 h-8 rounded-xl bg-muji-sand/50 text-muji-muted hover:text-red-500 hover:bg-red-50 transition-colors flex items-center justify-center text-xs">
                            <i class="fa-solid fa-minus"></i>
                        </button>
                    </div>
                </div>
                `;
            });

            container.innerHTML = html;
        }

        function renderLibraryList() {
            const container = document.getElementById('library-list-container');
            let filtered = EXERCISE_DATABASE;

            // Apply Muscle Filter
            if (state.filterMuscle !== 'all') {
                filtered = filtered.filter(ex => ex.muscle === state.filterMuscle);
            }

            // Apply Equipment Filter
            if (state.filterEquipment !== 'all') {
                filtered = filtered.filter(ex => ex.equipment === state.filterEquipment);
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                <div class="text-center py-8 text-xs text-muji-muted">
                    沒有符合條件的訓練動作
                </div>`;
                return;
            }

            let html = '';
            filtered.forEach(item => {
                const isAdded = state.todayList.includes(item.id);

                html += `
                <div class="bg-white border border-muji-border rounded-2xl p-4 shadow-xs flex items-center justify-between">
                    <div class="flex-1 min-w-0 pr-3">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-[10px] px-2 py-0.5 rounded-md ${item.equipment === '徒手' ? 'bg-amber-50 text-amber-700 border border-amber-200/50' : 'bg-stone-100 text-stone-700 border border-stone-200/60'}">${item.equipment}</span>
                            <span class="text-[10px] px-2 py-0.5 rounded-md bg-muji-sand text-muji-muted">${item.muscle}</span>
                        </div>
                        <h4 class="text-sm font-medium text-muji-text">${item.name}</h4>
                        <p class="text-xs text-muji-muted mt-0.5 font-mono">${item.sets}</p>
                        ${item.note ? `<p class="text-[11px] text-muji-muted/80 mt-1 italic">${item.note}</p>` : ''}
                    </div>

                    <div>
                        ${isAdded ? `
                            <button onclick="removeFromToday('${item.id}')" class="px-3 py-1.5 rounded-xl bg-muji-matchaLight text-muji-matcha text-xs font-medium flex items-center gap-1 transition-all active:scale-95">
                                <i class="fa-solid fa-check text-[10px]"></i>
                                <span>已加入</span>
                            </button>
                        ` : `
                            <button onclick="addToToday('${item.id}')" class="px-3 py-1.5 rounded-xl bg-muji-sand hover:bg-muji-accent/40 text-muji-text text-xs font-medium flex items-center gap-1 transition-all active:scale-95">
                                <i class="fa-solid fa-plus text-[10px]"></i>
                                <span>加入</span>
                            </button>
                        `}
                    </div>
                </div>
                `;
            });

            container.innerHTML = html;
        }

        /* Filter Controller Functions */
        function setMuscleFilter(muscle) {
            state.filterMuscle = muscle;
            const btns = document.querySelectorAll('.filter-muscle-btn');
            btns.forEach(btn => {
                if ((muscle === 'all' && btn.textContent === '全部') || btn.textContent === muscle) {
                    btn.className = "filter-muscle-btn active px-3 py-1.5 rounded-full text-xs whitespace-nowrap bg-muji-text text-white transition-all";
                } else {
                    btn.className = "filter-muscle-btn px-3 py-1.5 rounded-full text-xs whitespace-nowrap bg-white text-muji-muted border border-muji-border hover:border-muji-accent transition-all";
                }
            });
            renderLibraryList();
        }

        function setEquipmentFilter(equip) {
            state.filterEquipment = equip;
            const btns = document.querySelectorAll('.filter-equip-btn');
            btns.forEach(btn => {
                const text = btn.textContent;
                if ((equip === 'all' && text.includes('全部')) || 
                    (equip === '徒手' && text.includes('徒手')) || 
                    (equip === '啞鈴' && text.includes('啞鈴'))) {
                    btn.className = "filter-equip-btn flex-1 py-1.5 text-center rounded-lg bg-muji-sand text-muji-text font-medium transition-all";
                } else {
                    btn.className = "filter-equip-btn flex-1 py-1.5 text-center rounded-lg text-muji-muted transition-all";
                }
            });
            renderLibraryList();
        }

        /* Checklist Interactions */
        function addToToday(id) {
            if (!state.todayList.includes(id)) {
                state.todayList.push(id);
                saveStateToStorage();
                renderApp();
                showToast("已加入今日清單");
            }
        }

        function removeFromToday(id) {
            state.todayList = state.todayList.filter(item => item !== id);
            delete state.completedItems[id];
            saveStateToStorage();
            renderApp();
            showToast("已從清單移除");
        }

        function toggleComplete(id) {
            state.completedItems[id] = !state.completedItems[id];
            saveStateToStorage();
            renderApp();
            
            // Haptic Feedback for iPhone Safari if available
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(40);
            }
        }

        function confirmResetAll() {
            if (confirm("確定要重置今日的鍛鍊記錄與選擇嗎？")) {
                state.todayList = [];
                state.completedItems = {};
                saveStateToStorage();
                renderApp();
                showToast("今日記錄已重置");
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const message = document.getElementById('toast-message').querySelector('span');
            message.textContent = msg;
            
            toast.classList.remove('opacity-0', '-translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-4');
            }, 1800);
        }

        /* Rest Timer Engine */
        function startTimer(seconds) {
            clearInterval(timer.interval);
            timer.totalSeconds = seconds;
            timer.remainingSeconds = seconds;
            timer.isRunning = true;

            updateTimerUI();
            showActiveTimerControls(true);

            timer.interval = setInterval(() => {
                if (timer.remainingSeconds > 0) {
                    timer.remainingSeconds--;
                    updateTimerUI();
                } else {
                    finishTimer();
                }
            }, 1000);
        }

        function toggleTimer() {
            if (!timer.isRunning && timer.remainingSeconds > 0) {
                // Resume
                timer.isRunning = true;
                timer.interval = setInterval(() => {
                    if (timer.remainingSeconds > 0) {
                        timer.remainingSeconds--;
                        updateTimerUI();
                    } else {
                        finishTimer();
                    }
                }, 1000);
            } else {
                // Pause
                timer.isRunning = false;
                clearInterval(timer.interval);
            }
            updateTimerToggleIcon();
        }

        function addTimerTime(seconds) {
            timer.remainingSeconds += seconds;
            timer.totalSeconds += seconds;
            updateTimerUI();
        }

        function resetTimer() {
            clearInterval(timer.interval);
            timer.isRunning = false;
            timer.remainingSeconds = 0;
            updateTimerUI();
            showActiveTimerControls(false);
        }

        function finishTimer() {
            resetTimer();
            playChimeSound();

            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate([200, 100, 200, 100, 300]);
            }

            showToast("休息時間結束！開始下一組吧");
        }

        function updateTimerUI() {
            const mins = Math.floor(timer.remainingSeconds / 60);
            const secs = timer.remainingSeconds % 60;
            const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            
            document.getElementById('timer-display').textContent = formatted;
            
            const timerIcon = document.getElementById('timer-icon-bg');
            if (timer.isRunning) {
                timerIcon.className = "w-9 h-9 rounded-xl bg-muji-matcha text-white flex items-center justify-center animate-pulse";
            } else {
                timerIcon.className = "w-9 h-9 rounded-xl bg-muji-sand text-muji-text flex items-center justify-center";
            }

            updateTimerToggleIcon();
        }

        function updateTimerToggleIcon() {
            const btn = document.getElementById('timer-toggle-btn');
            if (timer.isRunning) {
                btn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            } else {
                btn.innerHTML = '<i class="fa-solid fa-play"></i>';
            }
        }

        function showActiveTimerControls(active) {
            const presets = document.getElementById('timer-presets');
            const controls = document.getElementById('timer-controls');

            if (active) {
                presets.classList.add('hidden');
                controls.classList.remove('hidden');
            } else {
                presets.classList.remove('hidden');
                controls.classList.add('hidden');
            }
        }

        /* Web Audio API - Elegant Japanese Bell/Chime Sound without external URL dependencies */
        function playChimeSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                
                const ctx = new AudioContext();
                
                // First soft bell note
                playTone(ctx, 523.25, 0, 0.6);  // C5
                playTone(ctx, 659.25, 0.15, 0.8); // E5
                playTone(ctx, 783.99, 0.3, 1.2);  // G5
            } catch (e) {
                console.log("Web Audio API not supported or blocked", e);
            }
        }

        function playTone(ctx, freq, startTime, duration) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + startTime);

            gain.gain.setValueAtTime(0.3, ctx.currentTime + startTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + startTime + duration);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(ctx.currentTime + startTime);
            osc.stop(ctx.currentTime + startTime + duration);
        }
    </script>
</body>
