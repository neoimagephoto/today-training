<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>今日之鍛鍊 - 家居健身清單</title>
    
    <!-- iOS Web App Meta Tags & Apple Touch Icon -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="今日之鍛鍊">
    <link rel="apple-touch-icon-precomposed" href="icon-006.png">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Noto Sans TC & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        muji: {
                            bg: '#FBF9F5',         // 暖白 / 米白背景
                            card: '#FFFFFF',       // 卡片純白
                            text: '#2D2B2A',       // 柔和炭灰主字體
                            muted: '#8C857B',      // 次要木質灰文字
                            border: '#EFECE6',     // 淺米灰邊框
                            accent: '#D8CFC4',     // 淡米棕點綴
                            matcha: '#6E8A73',     // 抹茶綠（完成/強調色）
                            matchaLight: '#EBF1EC',// 抹茶淡綠背景
                            sand: '#F4F0EA',       // 沙色區塊
                            wood: '#A39382'        // 木質主調
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'PingFang TC', 'Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FBF9F5;
            color: #2D2B2A;
            font-family: 'Inter', -apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* Custom Scrollbar Styling - Subtle Japanese aesthetic */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #E8E2D5;
            border-radius: 4px;
        }

        /* Card check strike-through animation */
        .completed-title {
            text-decoration: line-through;
            color: #A09A91;
            transition: all 0.25s ease;
        }

        .checkbox-bounce {
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .checkbox-bounce:active {
            transform: scale(0.85);
        }

        /* Bottom safe area spacing for iPhone home indicator */
        .safe-pb {
            padding-bottom: calc(6.5rem + env(safe-area-inset-bottom, 16px));
        }

        /* Glassmorphism soft header bar */
        .glass-header {
            background: rgba(251, 249, 245, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* Custom Toast Notification */
        #toast {
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>
<body class="min-h-screen text-muji-text antialiased selection:bg-muji-matchaLight">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transform -translate-y-4 transition-all duration-300">
        <div id="toast-message" class="bg-muji-text text-white text-xs px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2">
            <i class="fa-solid fa-check text-muji-matcha"></i>
            <span id="toast-text">已更新操作</span>
        </div>
    </div>

    <!-- Custom Reset Confirmation Modal -->
    <div id="reset-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/25 backdrop-blur-xs opacity-0 pointer-events-none transition-opacity duration-200">
        <div id="reset-modal-card" class="bg-white rounded-2xl p-5 max-w-xs w-full shadow-lg border border-muji-border text-center space-y-3 transform scale-95 transition-transform duration-200">
            <div class="w-10 h-10 rounded-full bg-red-50 text-red-500 mx-auto flex items-center justify-center text-base">
                <i class="fa-solid fa-rotate-left"></i>
            </div>
            <div>
                <h3 class="text-sm font-semibold text-muji-text">確定要重置記錄？</h3>
                <p class="text-xs text-muji-muted mt-1 leading-relaxed">這將會清除今日所有打勾完成進度與自訂組數，恢復為初始狀態。</p>
            </div>
            <div class="flex items-center gap-2 pt-1">
                <button onclick="closeResetModal()" class="flex-1 py-2 bg-muji-sand text-muji-text text-xs rounded-xl font-medium hover:bg-muji-accent/40 active:scale-95 transition-all">取消</button>
                <button onclick="executeResetAll()" class="flex-1 py-2 bg-red-500 text-white text-xs rounded-xl font-medium hover:bg-red-600 active:scale-95 transition-all">確認重置</button>
            </div>
        </div>
    </div>

    <!-- Main Container restricted to Mobile Viewport Width -->
    <div class="max-w-md mx-auto min-h-screen relative flex flex-col bg-muji-bg shadow-sm">

        <!-- Fixed Sticky Top Controls Section -->
        <div class="sticky top-0 z-30 glass-header border-b border-muji-border/60 shadow-xs">
            <!-- Header Zone -->
            <header class="px-5 pt-4 pb-2">
                <div class="flex justify-between items-center">
                    <div>
                        <p id="current-date" class="text-xs font-medium text-muji-muted tracking-wider uppercase">2026年8月9日 星期日</p>
                        <h1 class="text-xl font-semibold tracking-wide text-muji-text mt-0.5">今日之鍛鍊</h1>
                    </div>
                    <button onclick="confirmResetAll()" class="text-xs text-muji-muted hover:text-red-500 transition-colors flex items-center gap-1 bg-muji-sand/70 px-2.5 py-1.5 rounded-lg active:scale-95">
                        <i class="fa-solid fa-rotate-left text-[10px]"></i>
                        <span>重置記錄</span>
                    </button>
                </div>
            </header>

            <!-- Progress Summary Section -->
            <section class="px-5 pt-1 pb-1">
                <div class="bg-white/90 border border-muji-border rounded-2xl p-3 shadow-xs">
                    <div class="flex justify-between items-baseline mb-1.5">
                        <span class="text-xs font-medium text-muji-muted">今日完成進度</span>
                        <span class="text-sm font-semibold text-muji-matcha" id="progress-text">0 / 0 (0%)</span>
                    </div>
                    <div class="w-full bg-muji-sand h-2.5 rounded-full overflow-hidden">
                        <div id="progress-bar" class="bg-muji-matcha h-full rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                    </div>
                </div>
            </section>

            <!-- Navigation Tabs -->
            <div class="px-5 my-2">
                <div class="grid grid-cols-2 bg-muji-sand/80 p-1 rounded-xl text-center text-xs font-medium">
                    <button id="tab-today" onclick="switchTab('today')" class="py-2 rounded-lg transition-all duration-200 bg-white shadow-xs text-muji-text font-semibold flex items-center justify-center gap-2">
                        <i class="fa-solid fa-list-check"></i>
                        <span>今日訓練</span>
                        <span id="badge-count" class="bg-muji-matcha text-white text-[10px] px-1.5 py-0.5 rounded-full min-w-[18px]">0</span>
                    </button>
                    <button id="tab-library" onclick="switchTab('library')" class="py-2 rounded-lg transition-all duration-200 text-muji-muted hover:text-muji-text flex items-center justify-center gap-2">
                        <i class="fa-solid fa-dumbbell"></i>
                        <span>動作檢索</span>
                    </button>
                </div>
            </div>

            <!-- Filter Controls -->
            <section id="filter-section" class="px-5 mb-2.5 hidden">
                <!-- Muscle Group Filter Pills -->
                <div class="flex items-center gap-1.5 overflow-x-auto pb-1.5 no-scrollbar scroll-smooth">
                    <button onclick="setMuscleFilter('all')" class="filter-muscle-btn active px-3 py-1 rounded-full text-xs whitespace-nowrap bg-muji-text text-white transition-all">全部</button>
                    <button onclick="setMuscleFilter('胸部')" class="filter-muscle-btn px-3 py-1 rounded-full text-xs whitespace-nowrap bg-white text-muji-muted border border-muji-border transition-all">胸部</button>
                    <button onclick="setMuscleFilter('背部')" class="filter-muscle-btn px-3 py-1 rounded-full text-xs whitespace-nowrap bg-white text-muji-muted border border-muji-border transition-all">背部</button>
                    <button onclick="setMuscleFilter('肩膀')" class="filter-muscle-btn px-3 py-1 rounded-full text-xs whitespace-nowrap bg-white text-muji-muted border border-muji-border transition-all">肩膀</button>
                    <button onclick="setMuscleFilter('手臂')" class="filter-muscle-btn px-3 py-1 rounded-full text-xs whitespace-nowrap bg-white text-muji-muted border border-muji-border transition-all">手臂</button>
                    <button onclick="setMuscleFilter('核心')" class="filter-muscle-btn px-3 py-1 rounded-full text-xs whitespace-nowrap bg-white text-muji-muted border border-muji-border transition-all">核心</button>
                    <button onclick="setMuscleFilter('腿部')" class="filter-muscle-btn px-3 py-1 rounded-full text-xs whitespace-nowrap bg-white text-muji-muted border border-muji-border transition-all">腿部</button>
                </div>

                <!-- Equipment Filter Buttons -->
                <div class="flex items-center justify-between bg-white/90 border border-muji-border/80 rounded-xl p-1 mt-1 text-xs">
                    <button onclick="setEquipmentFilter('all')" class="filter-equip-btn flex-1 py-1 text-center rounded-lg bg-muji-sand text-muji-text font-medium transition-all">全部器材</button>
                    <button onclick="setEquipmentFilter('徒手')" class="filter-equip-btn flex-1 py-1 text-center rounded-lg text-muji-muted transition-all">徒手訓練</button>
                    <button onclick="setEquipmentFilter('啞鈴')" class="filter-equip-btn flex-1 py-1 text-center rounded-lg text-muji-muted transition-all">啞鈴訓練</button>
                </div>
            </section>
        </div>

        <!-- Main Content Area -->
        <main class="flex-1 px-5 pt-3 safe-pb">
            <!-- VIEW 1: TODAY'S WORKOUT CHECKLIST -->
            <div id="view-today" class="space-y-3">
                <div id="today-empty-state" class="hidden text-center py-12 px-4">
                    <div class="w-16 h-16 mx-auto mb-3 rounded-full bg-muji-sand flex items-center justify-center text-muji-muted">
                        <i class="fa-solid fa-feather-pointed text-2xl"></i>
                    </div>
                    <h3 class="text-sm font-medium text-muji-text">今日清單尚未加入動作</h3>
                    <p class="text-xs text-muji-muted mt-1 leading-relaxed">請前往「動作檢索」選擇適合的訓練，<br>輕鬆建構屬於你的家居健身計劃。</p>
                    <button onclick="switchTab('library')" class="mt-4 px-4 py-2 bg-muji-text text-white text-xs rounded-xl shadow-xs active:scale-95 transition-all">
                        瀏覽訓練動作
                    </button>
                </div>

                <div id="today-list-container" class="space-y-3">
                    <!-- Cards will be populated dynamically -->
                </div>
            </div>

            <!-- VIEW 2: EXERCISE LIBRARY -->
            <div id="view-library" class="hidden space-y-3">
                <div id="library-list-container" class="space-y-3">
                    <!-- Cards will be populated dynamically -->
                </div>
            </div>
        </main>

        <!-- Floating Rest Timer Footer Bar -->
        <div id="timer-bar" class="fixed bottom-0 left-0 right-0 z-40 max-w-md mx-auto px-4 pb-4 pt-2 glass-header border-t border-muji-border/70">
            <div class="bg-white border border-muji-border/80 rounded-2xl p-3 shadow-md">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2.5">
                        <div id="timer-icon-bg" class="w-9 h-9 rounded-xl bg-muji-sand flex items-center justify-center text-muji-text">
                            <i class="fa-solid fa-stopwatch text-sm"></i>
                        </div>
                        <div>
                            <div class="flex items-center gap-1.5">
                                <p class="text-[10px] text-muji-muted font-medium tracking-wide">組間休息計時</p>
                                <!-- Mute Toggle Button -->
                                <button onclick="toggleMute()" id="mute-btn" class="text-muji-muted hover:text-muji-text text-xs p-1 rounded-md bg-muji-sand/50 hover:bg-muji-sand transition-all active:scale-90 flex items-center justify-center" title="切換靜音">
                                    <i id="mute-icon" class="fa-solid fa-volume-high text-muji-matcha"></i>
                                </button>
                            </div>
                            <p id="timer-display" class="text-lg font-mono font-bold text-muji-text leading-none mt-0.5">00:00</p>
                        </div>
                    </div>

                    <!-- Quick Preset Buttons -->
                    <div id="timer-presets" class="flex items-center gap-1">
                        <button onclick="startTimer(10)" class="px-2 py-1.5 bg-muji-sand hover:bg-muji-accent/40 rounded-lg text-xs font-medium text-muji-text transition-all active:scale-95">10秒</button>
                        <button onclick="startTimer(20)" class="px-2 py-1.5 bg-muji-sand hover:bg-muji-accent/40 rounded-lg text-xs font-medium text-muji-text transition-all active:scale-95">20秒</button>
                        <button onclick="startTimer(30)" class="px-2 py-1.5 bg-muji-sand hover:bg-muji-accent/40 rounded-lg text-xs font-medium text-muji-text transition-all active:scale-95">30秒</button>
                        <button onclick="startTimer(60)" class="px-2 py-1.5 bg-muji-sand hover:bg-muji-accent/40 rounded-lg text-xs font-medium text-muji-text transition-all active:scale-95">60秒</button>
                    </div>

                    <!-- Active Timer Controls -->
                    <div id="timer-controls" class="hidden flex items-center gap-2">
                        <button onclick="addTimerTime(10)" class="w-8 h-8 bg-muji-sand rounded-lg text-xs font-medium text-muji-text hover:bg-muji-accent/40 flex items-center justify-center">+10</button>
                        <button id="timer-toggle-btn" onclick="toggleTimer()" class="w-8 h-8 bg-muji-text text-white rounded-lg text-xs flex items-center justify-center">
                            <i class="fa-solid fa-pause"></i>
                        </button>
                        <button onclick="resetTimer()" class="w-8 h-8 bg-red-50 text-red-600 rounded-lg text-xs flex items-center justify-center">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        /* Comprehensive Exercise Database strictly constrained to Bodyweight & Dumbbells */
        const EXERCISE_DATABASE = [
            // 胸部 (Chest)
            { 
                id: 'c1', 
                name: '標準俯臥撐 Standard Push-ups', 
                muscle: '胸部', 
                equipment: '徒手', 
                defaultSets: 3, 
                defaultReps: 12, 
                unit: '次', 
                desc: '雙手略寬於肩，手掌平貼地面，全身緊繃呈一直線。下沉軀幹至胸口離地約一拳距離，再由胸肌發力推回起始姿態。',
                caution: '過程中切勿沉腰或聳肩；手肘下沉時與軀幹保持約 45 度角，避免肩關節負擔過大。'
            },
            { 
                id: 'c2', 
                name: '啞鈴地板推舉 Dumbbell Floor Press', 
                muscle: '胸部', 
                equipment: '啞鈴', 
                defaultSets: 3, 
                defaultReps: 12, 
                unit: '次', 
                desc: '仰臥於地面，雙腳屈膝踩地，雙手持啞鈴於胸兩側。發力垂直向上推舉至手臂伸直，下放至上臂輕觸地面即推起。',
                caution: '上臂觸地時切勿放鬆或重擊地面；收緊肩胛骨，下背自然微拱，避免手腕向後過度翻折。'
            },
            { 
                id: 'c3', 
                name: '椅邊屈臂伸 Chair Dips', 
                muscle: '胸部', 
                equipment: '徒手', 
                defaultSets: 3, 
                defaultReps: 10, 
                unit: '次', 
                desc: '雙手支撐於穩固椅凳邊緣，雙腿前伸，屈肘使軀幹垂直下沉，直到手肘呈 90 度，再由三頭肌與胸肌發力推起。',
                caution: '務必使用穩固不滑動的椅子；下沉深度適中即可，避免肩膀前傾過度導致肩關節拉傷。'
            },
            { 
                id: 'c4', 
                name: '啞鈴平躺飛鳥 Dumbbell Flyes', 
                muscle: '胸部', 
                equipment: '啞鈴', 
                defaultSets: 3, 
                defaultReps: 12, 
                unit: '次', 
                desc: '仰臥於地面，雙手持啞鈴向天花板伸直，手肘微彎。向兩側呈弧形張開至胸肌有拉伸感，再以夾胸感受將啞鈴收回。',
                caution: '全程保持手肘微曲鎖定角度，切勿做成推舉；下放時控制速度，避免拉傷胸大肌肌腱。'
            },
            { 
                id: 'c5', 
                name: '跪姿俯臥撐 Knee Push-ups', 
                muscle: '胸部', 
                equipment: '徒手', 
                defaultSets: 3, 
                defaultReps: 15, 
                unit: '次', 
                desc: '雙膝著地、雙腳可微抬交叉，上半身與大腿呈一直線。雙手支撐進行俯臥撐下沉與推起，適合建立基礎胸肌力量。',
                caution: '臀部切勿凸起或過度下沉，核心必須全程夾緊；動作離心下降時保持 2 秒緩慢節奏。'
            },

            // 背部 (Back)
            { 
                id: 'b1', 
                name: '雙臂啞鈴俯身划船 Dumbbell Bent-Over Row', 
                muscle: '背部', 
                equipment: '啞鈴', 
                defaultSets: 3, 
                defaultReps: 12, 
                unit: '次', 
                desc: '雙腳與肩同寬，屈膝俯身約 45 度，背部保持平直。雙手持啞鈴順著大腿向髖部拉起，頂峰時感受肩胛骨向中間夾緊。',
                caution: '切勿圓背拱腰或靠腰部上下晃動借力；發力時以手肘帶動啞鈴，而非單純用手臂拉動。'
            },
            { 
                id: 'b2', 
                name: '超人式背肌伸展 Superman', 
                muscle: '背部', 
                equipment: '徒手', 
                defaultSets: 3, 
                defaultReps: 15, 
                unit: '次', 
                desc: '俯臥於地面，雙手向前伸直，核心收緊。同時將雙手、胸部與雙腿抬離地面，頂峰停頓 1-2 秒後緩慢還原。',
                caution: '頸部保持中立，視線看向地面，切勿過度抬頭；動作宜慢不宜快，注重下背與臀肌收縮。'
            },
            { 
                id: 'b3', 
                name: '單臂啞鈴划船 Single-Arm Dumbbell Row', 
                muscle: '背部', 
                equipment: '啞鈴', 
                defaultSets: 3, 
                defaultReps: 12, 
                unit: '次', 
                desc: '一手一膝支撐於穩固椅面上，另一手持啞鈴垂於體側。將啞鈴沿弧線向髖骨方向拉起，頂峰擠壓單側背肌。',
                caution: '軀幹保持平行地面不隨意旋轉；下放啞鈴時保持張力，切勿直接放鬆垂落。'
            },
            { 
                id: 'b4', 
                name: '俯臥 Y-T-W 提臂 Prone Y-T-W Raises', 
                muscle: '背部', 
                equipment: '徒手', 
                defaultSets: 3, 
                defaultReps: 12, 
                unit: '次', 
                desc: '俯臥於地面，雙手分別向外擺出 Y、T、W 形狀並向上抬起離地，強化上背、斜方肌與肩袖肌群穩定度。',
                caution: '大拇指朝上，由肩胛骨收縮帶動發力；重量來自自身手臂重量即可，無需追求高抬幅度。'
            },
            { 
                id: 'b5', 
                name: '啞鈴反向飛鳥 Dumbbell Reverse Fly', 
                muscle: '背部', 
                equipment: '啞鈴', 
                defaultSets: 3, 
                defaultReps: 12, 
                unit: '次', 
                desc: '雙腳與肩同寬俯身，微屈膝背打直。手肘保持微彎，向兩側抬起啞鈴至平行地面，擠壓後三角肌與上背肌群。',

                muscle: '肩膀', 
                equipment: '啞鈴', 
                defaultSets: 3, 
                defaultReps: 12, 
                unit: '次', 
                desc: '坐於穩固椅上背部挺直，雙手持啞鈴於肩兩側（掌心朝前）。垂直向上推舉至手臂接近伸直，再緩慢下放至耳朵高度。',
                caution: '核心收緊，避免下背過度拱起；推至頂點時啞鈴切勿相撞，手肘不要完全鎖死。'
            },
            { 
                id: 's2', 
                name: '啞鈴側平舉 Dumbbell Lateral Raise', 
                muscle: '肩膀', 
                equipment: '啞鈴', 
                defaultSets: 3,

        /* Timer & Web Audio State */

        /* Initialize App on Load */
        window.onload = function() {
            initDate();
            loadStateFromStorage();
            updateMuteUI();
            renderApp();
            
            // Unlock Web Audio API context on first touch for iOS Safari compatibility
            document.body.addEventListener('touchstart', initAudioContext, { once: true });
            document.body.addEventListener('click', initAudioContext, { once: true });

        // Render Current Date with Traditional Chinese Format
        function initDate() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            const dateStr = now.toLocaleDateString('zh-TW', options);
            const dateEl = document.getElementById('current-date');
            if (dateEl) dateEl.textContent = dateStr;
        }

        // LocalStorage Helpers
        function loadStateFromStorage() {
            try {
                const savedToday = localStorage.getItem('muji_workout_today');
                const savedCompleted = localStorage.getItem('muji_workout_completed');
                const savedCustom = localStorage.getItem('muji_workout_custom');
                const savedMuted = localStorage.getItem('muji_workout_muted');
                
                if (savedToday) state.todayList = JSON.parse(savedToday);
                if (savedCompleted) state.completedItems = JSON.parse(savedCompleted);
                if (savedCustom) state.customSetsReps = JSON.parse(savedCustom);
                if (savedMuted !== null) isMuted = JSON.parse(savedMuted);
            } catch (e) {
                console.error("Failed to load local storage", e);
            }
        }

        function saveStateToStorage() {
            try {
                localStorage.setItem('muji_workout_today', JSON.stringify(state.todayList));
                localStorage.setItem('muji_workout_completed', JSON.stringify(state.completedItems));
                localStorage.setItem('muji_workout_custom', JSON.stringify(state.customSetsReps));
                localStorage.setItem('muji_workout_muted', JSON.stringify(isMuted));
            } catch (e) {
                console.error("Failed to save local storage", e);
            }
        }

        function updateProgress() {
            const total = state.todayList.length;
            const completed = state.todayList.filter(id => !!state.completedItems[id]).length;
            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;

            const progressText = document.getElementById('progress-text');
            const progressBar = document.getElementById('progress-bar');

            if (progressText) {
                progressText.textContent = `${completed} / ${total} (${percent}%)`;
            }
            if (progressBar) {
                progressBar.style.width = `${percent}%`;
            }
        }

        function updateBadge() {
            const badge = document.getElementById('badge-count');
            if (badge) {
                badge.textContent = state.todayList.length;
            }
        }

        function switchTab(tab) {
            state.currentTab = tab;
            const viewToday = document.getElementById('view-today');
            const viewLibrary = document.getElementById('view-library');
            const filterSection = document.getElementById('filter-section');
            const tabToday = document.getElementById('tab-today');
            const tabLibrary = document.getElementById('tab-library');

            if (tab === 'today') {
                viewToday.classList.remove('hidden');
                viewLibrary.classList.add('hidden');
                filterSection.classList.add('hidden');

                tabToday.className = "py-2.5 rounded-lg transition-all duration-200 bg-white shadow-xs text-muji-text font-semibold flex items-center justify-center gap-2";
                tabLibrary.className = "py-2.5 rounded-lg transition-all duration-200 text-muji-muted hover:text-muji-text flex items-center justify-center gap-2";
            } else {
                viewToday.classList.add('hidden');
                viewLibrary.classList.remove('hidden');
                filterSection.classList.remove('hidden');

                tabToday.className = "py-2.5 rounded-lg transition-all duration-200 text-muji-muted hover:text-muji-text flex items-center justify-center gap-2";
                tabLibrary.className = "py-2.5 rounded-lg transition-all duration-200 bg-white shadow-xs text-muji-text font-semibold flex items-center justify-center gap-2";
            }
            renderApp();
        }

        function setMuscleFilter(muscle) {
            state.filterMuscle = muscle;
            document.querySelectorAll('.filter-muscle-btn').forEach(btn => {
                if (btn.textContent.trim().includes(muscle) || (muscle === 'all' && btn.textContent.trim() === '全部')) {
                    btn.className = "filter-muscle-btn active px-3 py-1.5 rounded-full text-xs whitespace-nowrap bg-muji-text text-white transition-all";
                } else {
                    btn.className = "filter-muscle-btn px-3 py-1.5 rounded-full text-xs whitespace-nowrap bg-white text-muji-muted border border-muji-border transition-all";
                }
            });
            renderLibraryList();
        }

        function setEquipmentFilter(equip) {
            state.filterEquipment = equip;
            document.querySelectorAll('.filter-equip-btn').forEach(btn => {
                const text = btn.textContent.trim();
                if ((equip === 'all' && text === '全部器材') || (equip === '徒手' && text === '徒手訓練') || (equip === '啞鈴' && text === '啞鈴訓練')) {
                    btn.className = "filter-equip-btn flex-1 py-1.5 text-center rounded-lg bg-muji-sand text-muji-text font-medium transition-all";

                    btn.className = "filter-equip-btn flex-1 py-1.5 text-center rounded-lg text-muji-muted transition-all";
                }
            });
            renderLibraryList();
        }

        function getExerciseSetsReps(id) {
            const item = EXERCISE_DATABASE.find(ex => ex.id === id);
            if (!item) return { sets: 3, reps: 12, unit: '次' };
            const custom = state.customSetsReps[id];
            return {
                sets: custom && custom.sets ? custom.sets : item.defaultSets,
                reps: custom && custom.reps ? custom.reps : item.defaultReps,
                unit: item.unit
            };
        }

        function adjustSets(id, delta, event) {
            if (event) event.stopPropagation();
            const current = getExerciseSetsReps(id);
            const newSets = Math.max(1, Math.min(20, current.sets + delta));
            
            if (!state.customSetsReps[id]) {
                const item = EXERCISE_DATABASE.find(ex => ex.id === id);
                state.customSetsReps[id] = { sets: item.defaultSets, reps: item.defaultReps };
            }
            state.customSetsReps[id].sets = newSets;
            saveStateToStorage();
            renderApp();
        }

        function adjustReps(id, delta, event) {
            if (event) event.stopPropagation();
            const item = EXERCISE_DATABASE.find(ex => ex.id === id);
            const current = getExerciseSetsReps(id);
            const step = item.unit === '秒' ? 5 : 1;
            const newReps = Math.max(1, Math.min(300, current.reps + (delta * step)));
            
            if (!state.customSetsReps[id]) {
                state.customSetsReps[id] = { sets: item.defaultSets, reps: item.defaultReps };
            }
            state.customSetsReps[id].reps = newReps;
            saveStateToStorage();
            renderApp();
        }

        function toggleTodayItem(id) {
            const index = state.todayList.indexOf(id);
            if (index > -1) {
                state.todayList.splice(index, 1);
                delete state.completedItems[id];
                showToast("已從今日清單中移除");
            } else {
                state.todayList.push(id);
                showToast("已加入今日清單");
            }
            saveStateToStorage();
            renderApp();
        }

        function toggleComplete(id) {
            state.completedItems[id] = !state.completedItems[id];
            saveStateToStorage();
            updateProgress();
            renderTodayList();
        }

            const detailsEl = document.getElementById(`details-${id}`);

            if (detailsEl) {
                detailsEl.classList.toggle('hidden');
            }
            if (iconEl) {
                iconEl.classList.toggle('rotate-180');
            }
        }

            updateBadge();
            if (state.currentTab === 'today') {
                renderTodayList();
            } else {
                renderLibraryList();
            }
        }

        function initAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTimerSound() {
            if (isMuted) return;
            initAudioContext();
            if (!audioCtx) return;

            try {
                // Synthesize a serene Japanese Rin/Chime sound (日系清脆磬音) using Web Audio API
                const now = audioCtx.currentTime;
                
                // Clear high harmonic frequencies for traditional Japanese bell / singing bowl resonance
                const freqs = [1567.98, 3135.96, 4703.94]; // G6 fundamental + high overtones
                const volumes = [0.22, 0.08, 0.03];
                const decayTimes = [2.5, 1.8, 1.2];

                freqs.forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now);
                    // Micro-pitch drift for organic metallic ring decay
                    osc.frequency.exponentialRampToValueAtTime(freq * 0.998, now + decayTimes[i]);

                    // Fast crisp strike attack, followed by long tranquil decay
                    gain.gain.setValueAtTime(0.001, now);
                    gain.gain.linearRampToValueAtTime(volumes[i], now + 0.008);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + decayTimes[i]);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(now);
                    osc.stop(now + decayTimes[i]);
                });
            } catch (e) {
                console.error("Audio playback error", e);
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            saveStateToStorage();
            updateMuteUI();
            showToast(isMuted ? "已切換為靜音模式" : "已開啟提示音效");
        }

        function updateMuteUI() {
            const icon = document.getElementById('mute-icon');
            if (icon) {
                if (isMuted) {
                    icon.className = "fa-solid fa-volume-xmark text-muji-muted";
                } else {
                    icon.className = "fa-solid fa-volume-high text-muji-matcha";
                }
            }
        }

        function startTimer(seconds) {
            initAudioContext();
            clearInterval(timer.interval);
            timer.totalSeconds = seconds;
            timer.remainingSeconds = seconds;
            timer.isRunning = true;

            document.getElementById('timer-presets').classList.add('hidden');
            document.getElementById('timer-controls').classList.remove('hidden');

            updateTimerDisplay();

            timer.interval = setInterval(() => {
                if (timer.remainingSeconds > 0) {
                    timer.remainingSeconds--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timer.interval);
                    timer.isRunning = false;
                    playTimerSound();
                    showToast("⏰ 休息時間結束！開始下一組鍛鍊");
                    resetTimer();
                }
            }, 1000);
        }

        function toggleTimer() {
            const toggleBtn = document.getElementById('timer-toggle-btn');
            if (timer.isRunning) {
                clearInterval(timer.interval);
                timer.isRunning = false;
                if (toggleBtn) toggleBtn.innerHTML = `<i class="fa-solid fa-play"></i>`;
            } else if (timer.remainingSeconds > 0) {
                timer.isRunning = true;
                if (toggleBtn) toggleBtn.innerHTML = `<i class="fa-solid fa-pause"></i>`;
                timer.interval = setInterval(() => {
                    if (timer.remainingSeconds > 0) {
                        timer.remainingSeconds--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(timer.interval);
                        timer.isRunning = false;
                        playTimerSound();
                        showToast("⏰ 休息時間結束！開始下一組鍛鍊");
                        resetTimer();
                    }
                }, 1000);
            }
        }

        function addTimerTime(secs) {
            timer.remainingSeconds += secs;
            updateTimerDisplay();
        }

        function resetTimer() {
            clearInterval(timer.interval);
            timer.isRunning = false;
            timer.remainingSeconds = 0;
            updateTimerDisplay();

            const toggleBtn = document.getElementById('timer-toggle-btn');
            if (toggleBtn) toggleBtn.innerHTML = `<i class="fa-solid fa-pause"></i>`;

            document.getElementById('timer-presets').classList.remove('hidden');
            document.getElementById('timer-controls').classList.add('hidden');
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timer.remainingSeconds / 60);
            const secs = timer.remainingSeconds % 60;
            const str = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            const el = document.getElementById('timer-display');
            if (el) el.textContent = str;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toast-text');
            if (toast && toastText) {
                toastText.textContent = message;
                toast.classList.remove('opacity-0', '-translate-y-4');
                toast.classList.add('opacity-100', 'translate-y-0');

                setTimeout(() => {
                    toast.classList.remove('opacity-100', 'translate-y-0');
                    toast.classList.add('opacity-0', '-translate-y-4');
                }, 2200);
            }
        }

        function confirmResetAll() {
            openResetModal();
        }

        function openResetModal() {
            const modal = document.getElementById('reset-modal');
            const card = document.getElementById('reset-modal-card');
            if (modal && card) {
                modal.classList.remove('opacity-0', 'pointer-events-none');
                card.classList.remove('scale-95');
                card.classList.add('scale-100');
            }
        }

        function closeResetModal() {
            const modal = document.getElementById('reset-modal');
            const card = document.getElementById('reset-modal-card');
            if (modal && card) {
                modal.classList.add('opacity-0', 'pointer-events-none');
                card.classList.remove('scale-100');
                card.classList.add('scale-95');
            }
        }

        function executeResetAll() {
            closeResetModal();
            // Clear runtime state (清空今日清單、勾選狀態與自訂組數)
            state.todayList = [];
            state.completedItems = {};
            state.customSetsReps = {};

            // Clear local storage entries
            try {
                localStorage.removeItem('muji_workout_today');
                localStorage.removeItem('muji_workout_completed');
                localStorage.removeItem('muji_workout_custom');
            } catch (e) {
                console.error("Failed to reset local storage", e);
            }

            // Re-render UI and present feedback
            renderApp();
            showToast("已重置所有清單與訓練記錄");
        }
    </script>
